server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:oracle:thin:@<tu_oracle_db_alias>?TNS_ADMIN=/path/to/wallet
    username: <tu_usuario>
    password: <tu_contrasena>
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

catalog:
  service:
    url: http://localhost:8082 # URL interna del microservicio de catalogo