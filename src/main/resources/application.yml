server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos
    username: postgres
    password: 'admin'
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

catalog:
  service:
    url: http://localhost:8082