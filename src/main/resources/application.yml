server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

  datasource:
    # Usamos la ruta relativa ./src/main/resources/wallet para que funcione en cualquier PC
    url: jdbc:oracle:thin:@pedidos_high?TNS_ADMIN=./src/main/resources/wallet
    username: ADMIN
    password: Pedidos...670 # Coloca tu contraseña real de Oracle Cloud
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

catalog:
  service:
    url: http://localhost:8082